name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis: the concurrency tests need Postgres row locking,
    # and the event-bus/presence tests need Redis (they would skip without it).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: collabspace
          POSTGRES_PASSWORD: collabspace
          # The suite's own database (conftest derives "<DATABASE_URL db>_test").
          POSTGRES_DB: collabspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabspace -d collabspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Throwaway CI-only credentials for the service containers above.
      DATABASE_URL: postgresql+psycopg://collabspace:collabspace@localhost:5432/collabspace
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The app refuses to start without a signing key. Generate a random one
      # per run rather than committing one, even a test-only one.
      - name: Generate a JWT secret for this run
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Run migrations against the test database
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://collabspace:collabspace@localhost:5432/collabspace_test

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
