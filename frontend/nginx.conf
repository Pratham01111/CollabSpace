# Serves the built SPA and proxies the API, so the browser talks to a single
# origin: no CORS, and nothing about the backend's address is baked into the JS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api/... -> backend/... (the trailing slashes strip the /api prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws/workspaces/{id}.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live sockets sit idle between events; uvicorn pings every 20s, so
        # this only needs to outlast that.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /workspaces/3, ...) all load the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# "upgrade" for WebSocket requests, otherwise a normal keep-alive request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
